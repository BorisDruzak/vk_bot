name: Offline OMSU analytics
on: [push, pull_request]
jobs:
  analytics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_omsu_analytics.py -v
      - run: python -m unittest discover -s tests -p test_analytics_scheduled.py -v
      - run: python -m unittest discover -s tests -p test_analytics_web.py -v
      - run: python -m unittest discover -s tests -p test_analytics_http.py -v
