name: Offline checks
on:
  push:
  pull_request:
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Compile all source files
        run: python -m compileall -q vk_unified.py vk_accounts.py vk_account_smoke.py vk_api_read.py vk_batch.py vk_groups.py vk_test.py
      - name: Account/profile unit tests (no VK login)
        run: python -m unittest discover -s tests -p 'test_accounts_v624.py' -q
      - name: Second account smoke unit tests (no VK login)
        run: python -m unittest discover -s tests -p 'test_account2_smoke_v625.py' -q
